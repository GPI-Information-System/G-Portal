name: Release and Deploy

on:
  push:
    branches:
      - main

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_deploy: ${{ steps.check_tag.outputs.exists == 'false' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version From Src Folder
        id: get_version
        run: |
          VERSION=""
          REGEX="v[0-9]+\.[0-9]+\.[0-9]+([-+][^<]+)?"

          if [ -f "src/index.php" ]; then
            VERSION=$(grep -oE "$REGEX" src/index.php | head -n 1)
          fi

          if [ -z "$VERSION" ] && [ -f "src/login.php" ]; then
            VERSION=$(grep -oE "$REGEX" src/login.php | head -n 1)
          fi

          if [ -z "$VERSION" ]; then
            echo "❌ No valid version string found."
            exit 1
          fi

          FINAL_VERSION=$(echo "$VERSION" | tr -d '\r\n ' )
          echo "version=$FINAL_VERSION" >> $GITHUB_OUTPUT

      - name: Check If Tag Already Exists
        id: check_tag
        run: |
          git fetch --tags
          if git rev-parse "${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Notes and Publish Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}

  trigger-deployment:
    runs-on: self-hosted
    needs: check-and-release
    if: needs.check-and-release.outputs.should_deploy == 'true'
    steps:
      - name: Ping Webhook
        run: |
          echo "📶 Pinging deployment webhook..."
          sleep 5
          curl -k -X POST "${{ vars.WEBHOOK }}"
