; --- 1. Execution & Timeouts ---
; Cap script execution at 600 seconds (Matches your database net_read/write timeouts)
max_execution_time = 600
; Give the server 600 seconds to parse incoming form/file data 
max_input_time = 600
; Limit memory to 256MB per script. This allows up to 15-20 heavy parallel scripts 
; without pushing the host past its remaining ~3.5GB RAM pool.
memory_limit = 256M

; --- 2. File Uploads (Calibrated for High Traffic) ---
; Maximum size of a single uploaded file (Safely below your 64M DB packet size)
upload_max_filesize = 50M
; Total size of the entire POST request payload (Accommodates file + form text)
post_max_size = 60M
; Max files uploaded in a single request (Lowered from 50 to prevent disk-write bottlenecks)
max_file_uploads = 20

; --- 3. Output Buffering & Performance ---
; Buffer 4KB of data before sending to Apache to reduce network packet overhead
output_buffering = 4096
; Keep off so PHP buffers chunks instead of flooding the Apache network buffer
implicit_flush = Off