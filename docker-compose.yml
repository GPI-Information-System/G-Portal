services:
  app:
    build:
      context: .
      dockerfile: ./php/Dockerfile
    container_name: gportal-app
    image: gportal-app:local
    restart: unless-stopped
    volumes:
      - ${FILE_SERVER_PATH}/config/database.php:/var/www/html/config/database.php
      - ${FILE_SERVER_PATH}/uploads:/var/www/html/uploads
      - ${FILE_SERVER_PATH}/logs:/var/www/html/backend/logs
      - ${FILE_SERVER_PATH}/sessions:/var/www/html/sessions
    ports:
      - "${APP_HOST_PORT}:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TZ=${TZ}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    build:
      context: .
      dockerfile: ./db/Dockerfile
    container_name: gportal-db
    image: gportal-db:local
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gportal
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${DB_HOST_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  db_data:

networks:
  internal:
    name: webnet
    external: true
